<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Log In</title>
  <link rel="stylesheet" href="login.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  
  <div class="card">
    
    
    <a href="index.html" class="brand-link"><span class="brand-blue">Task</span>Flow</a>


    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Log in to manage your tasks and stay productive.</p>

    <!-- Google Log In Button -->
<button type="button" class="google-btn">
  <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo" class="google-icon">
  Log in with Google
</button>

<div class="divider"><span>or log in with email</span></div>

    
    <form class="login-form">

      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" required>
      </div>

    
      <div class="form-group">
  <label for="password">Password</label>
  <div style="position: relative; display: flex; align-items: center;">
    <input type="password" id="password" placeholder="Enter your password" required style="width: 100%; padding-right: 50px;">
    <!-- Text button placed right inside/next to the input field -->
    <button type="button" id="togglePassword" style="position: absolute; right: 12px; background: none; border: none; color: #2563eb; font-size: 12px; font-weight: 600; cursor: pointer;">Show</button>
  </div>
</div>

      
      <div class="form-actions">
        <div class="checkbox-group">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      
      <button type="submit" class="submit-btn">Log In</button>

    </form>

    <p class="signup-prompt">
      Don't have an account? <a href="signup.html" class="signup-link">Create an account</a>
    </p>
  </div>

  <script src="login.js"></script>

</body>
</html>
