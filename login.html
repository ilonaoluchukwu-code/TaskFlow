<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Log In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  
  <div class="card">
    
    
    <a href="index.html" class="brand-link"><span class="brand-blue">Task</span>Flow</a>


    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Log in to manage your tasks and stay productive.</p>

    
    <form class="login-form">

      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" required>
      </div>

    
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="show-btn">Show</button>
        </div>
      </div>

      
      <div class="form-actions">
        <div class="checkbox-group">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      
      <button type="submit" class="submit-btn">Log In</button>

    </form>

    <p class="signup-prompt">
      Don't have an account? <a href="signup.html" class="signup-link">Create an account</a>
    </p>

  </div>

</body>
</html>
