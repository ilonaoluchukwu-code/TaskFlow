<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Create Account</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  
  <div class="card">
    
  
    <a href="index.html" class="brand-link"><span class="brand-blue">Task</span>flow</a>

    
    <h1 class="title">Create your account</h1>

    
    <form class="signup-form">
      
    
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name">
      </div>

      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address">
      </div>

    
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Create a password">
          <button type="button" class="show-btn">Show</button>
        </div>
        <span class="hint-text">Use at least 8 characters</span>
      </div>

      
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm-password" placeholder="Confirm your password">
          <button type="button" class="show-btn">Show</button>
        </div>
      </div>

      
      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

    
      <button type="submit" class="submit-btn">Create Account</button>

    </form>

    
    <p class="login-prompt">
      Already have an account? <a href="login.html" class="login-link">Log in</a>
    </p>

  </div>
<script src="signup.js"></script>
</body>
</html>
